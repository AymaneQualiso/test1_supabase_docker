name: Deploy migrations

on:
  push:
    branches: [develop, master]
    # paths: ['supabase/migrations/**']   # only run when migrations change
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch:                    # allow a manual run from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    # master → production secrets, anything else → staging secrets
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0   # same as local, e.g. what --version printed

      - run: supabase link --project-ref ${{ secrets.PROJECT_ID }}

      - run: supabase db push --remote --yes   # visible in logs: what will run

      - run: supabase db push --remote